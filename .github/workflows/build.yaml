name: Build README

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '16 10 * * *'

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Render profile sheet
        # GITHUB_TOKEN feeds the GitHub API and the contribution graph.
        # No third-party badge service is involved; stdlib only, no pip install.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "🤖 rebuild profile sheet"
          git push
